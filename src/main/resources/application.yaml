server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  web:
    resources:
      static-locations: file:/app/frontend/,classpath:/static/
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://keycloak-production-cd3297f4.up.railway.app/realms/hostel}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: customer-service
              uri: ${CUSTOMER_URL:lb://CUSTOMER-SERVICE}
              predicates:
                - Path=/api/customers,/api/customers/**
              filters:
                - RemoveRequestHeader=Accept-Encoding
              metadata:
                response-timeout: 60000
                connect-timeout: 60000

            - id: vets-service
              uri: ${VETS_URL:lb://VETS-SERVICE}
              predicates:
                - Path=/api/vets,/api/vets/**
              filters:
                - RemoveRequestHeader=Accept-Encoding
              metadata:
                response-timeout: 60000
                connect-timeout: 60000

            - id: visits-service
              uri: ${VISITS_URL:lb://VISITS-SERVICE}
              predicates:
                - Path=/api/visits,/api/schedule,/api/visits/**,/api/schedule/**
              filters:
                - RemoveRequestHeader=Accept-Encoding
              metadata:
                response-timeout: 60000
                connect-timeout: 60000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
  instance:
    hostname: ${MY_HOSTNAME}
    secure-port-enabled: true
    non-secure-port-enabled: false
    status-page-url: https://${MY_HOSTNAME}/actuator/info
    health-check-url: https://${MY_HOSTNAME}/actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    circuitbreakers:
      show-details: always
    circuitbreakerevents:
      enabled: true
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: health-portal-api-gateway
    description: Единая точка входа портала «Здоровье»

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
    instances:
      customerService:
        baseConfig: default
      vetsService:
        baseConfig: default
      visitsService:
        baseConfig: default
      scheduleService:
        baseConfig: default

logging:
  level:
    root: INFO
    com.hospital: INFO
