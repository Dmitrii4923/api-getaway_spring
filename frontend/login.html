<!DOCTYPE html>
<html lang="ru">
<head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Вход — Здоровье</title> <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='8' fill='%232563eb'/%3E%3Cpath d='M50 78S22 60 22 42a15 15 0 0 1 28-8 15 15 0 0 1 28 8c0 18-28 36-28 36z' fill='white'/%3E%3C/svg%3E" /> <script src="https://cdn.tailwindcss.com"></script> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" /> <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-slate-50 p-4 text-slate-800"> <main class="max-w-md mx-auto pt-8"> <a href="index.html" class="flex items-center justify-center gap-2 mb-4"> <span class="inline-flex items-center justify-center w-10 h-10 rounded bg-blue-600 text-white"> <i class="fa-solid fa-heart-pulse"></i> </span> <span class="font-bold text-slate-800">Здоровье</span> </a> <section class="border border-slate-200 bg-white rounded-lg p-6"> <h1 class="text-xl font-bold text-slate-800">Вход в личный кабинет</h1> <p class="text-sm text-slate-500 mt-1 mb-4">Введите логин и пароль.</p> <form id="loginForm" class="flex flex-col gap-3"> <div> <label for="loginUsername" class="block text-sm font-semibold text-slate-600 mb-1">Логин</label> <input id="loginUsername" name="username" autocomplete="username" class="input-field" required /> </div> <div> <label for="loginPassword" class="block text-sm font-semibold text-slate-600 mb-1">Пароль</label> <div class="relative"> <input id="loginPassword" name="password" type="password" autocomplete="current-password" class="input-field pr-10" required /> <button type="button" data-toggle-password class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 p-1" aria-label="Показать пароль"> <i class="fa-regular fa-eye"></i> </button> </div> </div> <!-- Кнопка входа --> <button id="loginSubmit" type="submit" class="btn-primary justify-center"> <i class="fa-solid fa-right-to-bracket"></i> Войти </button> <p id="loginError" class="hidden rounded bg-rose-50 px-3 py-2 text-sm text-rose-600"></p> </form> <div class="mt-4 pt-4 border-t border-slate-200"> <p class="text-sm text-slate-500 mb-2">Нет учетной записи?</p> <a id="registerLink" href="#" class="btn-ghost w-full justify-center"> <i class="fa-solid fa-user-plus"></i> Зарегистрироваться </a> </div> <details class="mt-4 border border-slate-200 rounded p-3 bg-slate-50"> <summary class="cursor-pointer text-sm font-semibold text-blue-600">Вставить JWT-токен вручную</summary> <form id="manualTokenForm" class="mt-2 flex flex-col gap-2"> <textarea id="manualToken" rows="3" class="input-field text-xs" placeholder="JWT токен..." required></textarea> <button type="submit" class="btn-ghost justify-center">Сохранить токен</button> <p id="manualTokenError" class="hidden rounded bg-rose-50 px-3 py-2 text-sm text-rose-600"></p> </form> </details> <p class="mt-4"><a href="index.html" class="text-sm text-blue-600">← На главную</a></p> </section> </main> <script src="js/api.js"></script> <script src="js/login.js"></script>
</body>
</html>
