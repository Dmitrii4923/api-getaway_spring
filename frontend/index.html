<body class="min-h-screen bg-slate-50 text-slate-800"> <!-- Шапка --> <header class="border-b border-slate-200 bg-white"> <div class="max-w-5xl mx-auto px-4 py-4 flex items-center gap-2"> <a href="index.html" class="flex items-center gap-2"> <span class="inline-flex items-center justify-center w-10 h-10 rounded bg-blue-600 text-white"> <i class="fa-solid fa-heart-pulse"></i> </span> <span> <span class="block font-bold text-slate-800">Здоровье</span> <span class="block text-xs text-slate-500">Портал медицинских услуг</span> </span> </a> </div> </header> <main class="max-w-5xl mx-auto px-4 py-8"> <div class="grid grid-cols-1 md:grid-cols-2 gap-6"> <!-- Описание --> <section class="border border-slate-200 bg-white rounded-lg p-6"> <h1 class="text-2xl font-bold text-slate-800">Личный кабинет пациента</h1> <p class="mt-3 text-sm text-slate-500"> На портале можно записаться к врачу, посмотреть свои приёмы и электронные медицинские документы. </p> <div class="mt-4 flex flex-col gap-2"> <a href="schedule.html" class="btn-ghost justify-start"> <i class="fa-solid fa-calendar-plus"></i> Записаться к врачу </a> <a href="documents.html" class="btn-ghost justify-start"> <i class="fa-solid fa-folder-open"></i> Медицинские документы </a> </div> </section> <!-- Форма входа --> <section id="login" class="border border-slate-200 bg-white rounded-lg p-6"> <h2 class="text-xl font-bold text-slate-800">Вход</h2> <p class="text-sm text-slate-500 mb-4">Введите логин и пароль</p> <form id="loginForm" class="flex flex-col gap-3"> <div> <label for="loginUsername" class="block text-sm font-semibold text-slate-600 mb-1">Логин</label> <input id="loginUsername" name="username" autocomplete="username" class="input-field" required /> </div> <div> <label for="loginPassword" class="block text-sm font-semibold text-slate-600 mb-1">Пароль</label> <div class="relative"> <input id="loginPassword" name="password" type="password" autocomplete="current-password" class="input-field pr-10" required /> <button
